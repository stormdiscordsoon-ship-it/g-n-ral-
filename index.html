<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Robux Generator 2026</title>
<style>
  :root {
    --bg: #0b0f1a;
    --card: #151b2c;
    --accent: #00d26a;
    --accent2: #ffcc00;
    --text: #e8ecf5;
    --muted: #8a93a8;
    --danger: #ff4d4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1b2340, var(--bg));
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border-radius: 16px;
    padding: 28px 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    text-align: center;
  }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  h1 span { color: var(--accent2); }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: .9rem; }
  .online { color: var(--accent); font-size: .8rem; margin-bottom: 18px; }
  .online::before { content: "● "; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  label { display: block; text-align: left; font-size: .85rem; color: var(--muted); margin: 12px 0 6px; }
  input {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2a3350;
    background: #0e1322; color: var(--text); font-size: 1rem;
  }
  .amounts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 6px; }
  .amt {
    padding: 14px 8px; border-radius: 10px; border: 2px solid #2a3350; background: #0e1322;
    color: var(--text); font-weight: 700; cursor: pointer; font-size: 1rem;
  }
  .amt.sel { border-color: var(--accent2); color: var(--accent2); }
  button.go {
    margin-top: 22px; width: 100%; padding: 15px; border: 0; border-radius: 12px;
    background: var(--accent); color: #04140b; font-weight: 800; font-size: 1.1rem; cursor: pointer;
  }
  button.go:disabled { opacity: .5; cursor: not-allowed; }
  .hidden { display: none; }
  .bar { height: 14px; background: #0e1322; border-radius: 99px; overflow: hidden; margin: 18px 0 10px; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .25s; }
  #log {
    text-align: left; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem;
    color: var(--accent); background: #070a12; border-radius: 8px; padding: 10px; height: 150px; overflow-y: auto;
  }
  #log .err { color: var(--danger); }
  .prank h2 { font-size: 2.2rem; margin: 10px 0; color: var(--accent2); }
  .prank .emoji { font-size: 5rem; animation: spin 1.5s ease-in-out infinite; display: inline-block; }
  @keyframes spin { 50% { transform: rotate(20deg) scale(1.15); } }
  .prank p { color: var(--muted); }
  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
</style>
</head>
<body>
<div class="card" id="card">

  <!-- Étape 1 : formulaire -->
  <div id="step1">
    <h1 id="title">FREE <span>ROBUX</span> GENERATOR</h1>
    <p class="sub" id="subtitle">100% gratuit · 100% légit · aucun virus</p>
    <div class="online"><span id="users">4 812</span> joueurs en ligne</div>

    <label for="pseudo">Ton pseudo</label>
    <input id="pseudo" maxlength="20" placeholder="ex : xX_ProGamer_Xx" autocomplete="off">

    <label>Combien de Robux ?</label>
    <div class="amounts">
      <button class="amt" data-v="1000">1 000</button>
      <button class="amt" data-v="10000">10 000</button>
      <button class="amt" data-v="100000">100 000</button>
      <button class="amt" data-v="999999999">999 999 999</button>
    </div>

    <button class="go" id="go" disabled>GÉNÉRER 🚀</button>
  </div>

  <!-- Étape 2 : fausse génération -->
  <div id="step2" class="hidden">
    <h1>Génération en cours…</h1>
    <p class="sub" id="target"></p>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div id="pct">0 %</div>
    <div id="log"></div>
  </div>

  <!-- Étape 3 : révélation -->
  <div id="step3" class="hidden prank">
    <div class="emoji">🤡</div>
    <h2>T'AS ÉTÉ PRANK !</h2>
    <p id="final"></p>
    <p>Les générateurs de Robux gratuits n'existent pas.<br>
       Si un site te demande ton mot de passe pour ça, c'est une arnaque pour voler ton compte. 🔒</p>
    <button class="go" onclick="location.reload()">Réessayer (ça marchera pas non plus)</button>
  </div>

</div>

<script>
  // Rien n'est envoyé nulle part : tout reste dans la page.
  const $ = id => document.getElementById(id);
  let amount = 0;

  const fmt = n => n.toLocaleString("fr-FR");

  setInterval(() => {
    $("users").textContent = fmt(4000 + Math.floor(Math.random() * 2000));
  }, 1500);

  // Mode cadeau : index.html?pseudo=Lucas&robux=10000
  const params = new URLSearchParams(location.search);
  const giftPseudo = (params.get("pseudo") || "").slice(0, 20);
  const giftAmount = parseInt(params.get("robux"), 10);
  if (giftPseudo) {
    $("pseudo").value = giftPseudo;
    $("title").textContent = `🎁 ${giftPseudo}, quelqu'un t'a envoyé des Robux !`;
    $("subtitle").textContent = "Choisis ton montant et clique pour les récupérer sur ton compte.";
    $("go").textContent = "RÉCUPÉRER MES ROBUX 🚀";
  }
  if (giftAmount > 0) {
    amount = giftAmount;
    document.querySelectorAll(".amt").forEach(b => {
      if (+b.dataset.v === giftAmount) b.classList.add("sel");
    });
    if (giftPseudo) $("subtitle").textContent = `${fmt(giftAmount)} Robux t'attendent. Clique pour les récupérer sur ton compte.`;
  }

  const check = () => { $("go").disabled = !($("pseudo").value.trim() && amount); };
  $("pseudo").addEventListener("input", check);
  check();

  document.querySelectorAll(".amt").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".amt").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    amount = +b.dataset.v;
    check();
  }));

  const steps = [
    "Connexion aux serveurs Roblox…",
    "Contournement du pare-feu…",
    "Injection du script ultra-secret…",
    "Recherche du compte {p}…",
    "Compte trouvé ✔",
    "Copie des Robux depuis le compte de Builderman…",
    "Hack de la NASA (au cas où)…",
    "Vérification anti-bot…",
    "Envoi de {a} Robux…",
    "ERREUR 0x0420 : tentative de contournement…",
    "Presque fini…",
    "Finalisation…"
  ];

  $("go").addEventListener("click", () => {
    const pseudo = $("pseudo").value.trim();
    $("step1").classList.add("hidden");
    $("step2").classList.remove("hidden");
    $("target").textContent = `${fmt(amount)} Robux → ${pseudo}`;

    let pct = 0, i = 0;
    const timer = setInterval(() => {
      pct = Math.min(99, pct + Math.random() * 9);
      $("fill").style.width = pct + "%";
      $("pct").textContent = Math.floor(pct) + " %";

      if (i < steps.length && Math.random() < 0.6) {
        const line = document.createElement("div");
        const txt = steps[i].replace("{p}", pseudo).replace("{a}", fmt(amount));
        line.textContent = "> " + txt;
        if (txt.startsWith("ERREUR")) line.className = "err";
        $("log").appendChild(line);
        $("log").scrollTop = 1e9;
        i++;
      }

      if (pct >= 99 && i >= steps.length) {
        clearInterval(timer);
        // Bloque à 99 % un moment pour le suspense
        setTimeout(() => {
          $("card").classList.add("shake");
          $("step2").classList.add("hidden");
          $("step3").classList.remove("hidden");
          $("final").textContent = `${pseudo}, tu as reçu exactement 0 Robux sur ${fmt(amount)} demandés.`;
        }, 2500);
      }
    }, 350);
  });
</script>
</body>
</html>
